name = "sicar-c"
main = "src/index.js"
compatibility_date = "2026-10-13"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/config.js", "/interno", "/interno/*"]

[[d1_databases]]
binding = "DB"
database_name = "sicar-c"
database_id = "c78d1404-1db0-4916-bc54-6b465616abb3"

# Descomentar cuando R2 esté habilitado y el bucket "sicar-c-evidencia" exista:
# [[r2_buckets]]
# binding = "EVIDENCIA"
# bucket_name = "sicar-c-evidencia"

[vars]
LIMITE_HORA = "5"
AUTO_PUBLICAR = "1"
# Secreto (no va acá): npx wrangler secret put SALT

# Portal interno (Cloudflare Access). Se cargan en el panel de Cloudflare: ACCESS_TEAM_DOMAIN (p. ej. ofca.cloudflareaccess.com),
# ACCESS_AUD (Application Audience Tag) y ADMIN_EMAILS (lista separada por comas). Sin ellas el portal permanece cerrado.
